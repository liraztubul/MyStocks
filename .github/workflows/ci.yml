name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mystocks
          POSTGRES_PASSWORD: mystocks
          POSTGRES_DB: mystocks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mystocks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: mystocks
      POSTGRES_PASSWORD: mystocks
      POSTGRES_DB: mystocks
      POSTGRES_HOST: localhost
      JWT_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-chars
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
