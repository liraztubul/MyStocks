server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files: a missing one is a real 404, never index.html served as JavaScript or a font.
    location /static/ {
        try_files $uri =404;
    }

    location /fonts/ {
        try_files $uri =404;
    }

    # SPA fallback so client-side routes (e.g. /assets/AAPL) resolve on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
