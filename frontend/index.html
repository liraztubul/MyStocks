<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5ff" />
    <!-- Latin face is needed on every page; Hebrew loads only when Hebrew text appears. -->
    <link rel="preload" href="/fonts/rubik-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>MyStocks</title>
    <!-- Applies the saved theme before first paint so the page never flashes the wrong one.
         Classic (non-module) script so it runs synchronously; mirrors src/theme.ts. -->
    <script>
      (function () {
        var stored = null
        try {
          stored = localStorage.getItem('mystocks-theme')
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0f0d1f' : '#f7f5ff')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
