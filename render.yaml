# Render Blueprint for the MyStocks API. Create it from the dashboard (New > Blueprint) pointing
# at this repo; values marked "sync: false" are prompted for once and stored only in Render.
# Spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mystocks-api
    runtime: docker
    plan: free
    # Closest Render region to Neon's aws-eu-central-1 (Frankfurt); keep both in the same region.
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Liveness only: never touches the database (see app/api/probes.py).
    healthCheckPath: /healthz
    # Deploy only after the CI workflow's checks pass on the pushed commit.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      # Neon DIRECT connection string (no "-pooler" in the host), ending in ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Generated by Render on first deploy; never typed, pasted or committed.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FINNHUB_API_KEY
        sync: false
      - key: COINGECKO_DEMO_API_KEY
        sync: false
      # Unset or empty: registration is disabled in production.
      - key: REGISTRATION_INVITE_CODE
        sync: false
      # Emails allowed to see stock market data (personal-use licences). Unset or empty: nobody,
      # because ENVIRONMENT above is production. List only already-registered addresses.
      - key: STOCK_DATA_ALLOWED_EMAILS
        sync: false
      # Must equal ORIGIN_SECRET in the Vercel project.
      - key: ORIGIN_SECRET
        sync: false
      # The Vercel production URL, e.g. https://mystocks.vercel.app (no trailing slash).
      - key: ALLOWED_ORIGINS
        sync: false
