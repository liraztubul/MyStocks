[project]
name = "mystocks-backend"
version = "0.1.0"
description = "MyStocks API: transaction ledger, holdings and P/L."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "httpx2>=2.13",
    "cachetools>=5.3",
    # IANA zone data for zoneinfo on platforms without a system tz database (Windows, slim images).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live_network'"
markers = [
    "live_network: calls real Finnhub/CoinGecko APIs; excluded by default, run with -m live_network",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
