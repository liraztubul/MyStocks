[project]
name = "mystocks-backend"
version = "0.1.0"
description = "MyStocks API: transaction ledger, holdings and P/L."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "httpx2>=2.13",
    "cachetools>=5.3",
    # IANA zone data for zoneinfo on platforms without a system tz database (Windows, slim images).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    # Exact pins: a new release of either can fail CI with no change of ours.
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live_network'"
markers = [
    "live_network: calls real Finnhub/CoinGecko APIs; excluded by default, run with -m live_network",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Strict for the application. Listed flag by flag: `strict = true` in an override also turns
# strict checks on for the other modules (tests), seen with mypy 2.4.
[[tool.mypy.overrides]]
module = ["app.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
